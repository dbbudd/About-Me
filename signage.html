<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signage — Daniel Budd</title>
<meta name="robots" content="noindex">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; visibility: hidden; }
  iframe.show { visibility: visible; }
</style>
</head>
<body>
<script>
  // Canva's embed ignores autoplay parameters and can't be scripted cross-origin,
  // but it does open at a given page (#N). So we load each page in turn.
  var BASE = 'https://www.canva.com/design/DAHT7F3LaNw/ctxyPtIesNTXd-MQkDasig/view?embed';
  var PAGES = 3;        // number of pages in the Canva design
  var SECONDS = 8;      // time on each page

  var page = 0, current = null;

  function show(n) {
    var f = document.createElement('iframe');
    f.title = 'Signage slideshow';
    f.allow = 'autoplay; fullscreen';
    f.src = BASE + '#' + n;
    f.onload = function () {
      f.classList.add('show');
      if (current) current.remove();
      current = f;
    };
    document.body.appendChild(f);
  }

  function next() {
    page = page % PAGES + 1;
    show(page);
  }

  next();
  setInterval(next, SECONDS * 1000);
</script>
</body>
</html>
